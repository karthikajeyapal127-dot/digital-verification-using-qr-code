version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: veriglass-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: veriglass
    volumes:
      - mongodb_data:/data/db
    networks:
      - veriglass-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veriglass-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/veriglass
      - JWT_SECRET=supersecretjwtkey_veriglass_2026_modern_web_tech
      - JWT_EXPIRES_IN=30d
      - CLIENT_URL=http://localhost:5173
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
    depends_on:
      - mongodb
    networks:
      - veriglass-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veriglass-frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - veriglass-network

networks:
  veriglass-network:
    driver: bridge

volumes:
  mongodb_data:
